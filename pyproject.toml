[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buildquarry"
version = "0.1.0"
description = "Turn oversized software ideas into focused MVP plans."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "PySide6-Essentials>=6.7,<7",
    "pydantic>=2.7,<3",
    "keyring>=25,<26",
]

[project.scripts]
buildquarry = "buildquarry.main:main"

[tool.setuptools.packages.find]
where = ["src"]
